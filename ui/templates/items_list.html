<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory Items</title>
    <link rel="stylesheet" href="/static/items.css">
</head>
<body>
    <div class="items-container">
        <h2>Laboratory Items</h2>
        <a href="/predict"><button class="predict-btn" type="button">&#128200; Predict Usage</button></a>
        <a href="/predict-bar"><button class="chart-btn" type="button">&#128202; Show Usage Chart</button></a>
        <form method="post" style="margin-bottom: 18px; text-align: right;">
            <label for="day" style="font-weight:500; color:#2a4d69;">Prediction Day:</label>
            <input type="number" id="day" name="day" min="1" value="{{ day }}" style="width:60px; padding:4px 8px; border-radius:4px; border:1px solid #bfc9d1;">
            <button class="predict-btn" type="submit" style="padding:7px 18px; font-size:1em;">Update</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Predicted Usage (Day {{ day }})</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.category }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>{% if item.predicted != 'N/A' %}{{ item.predicted }}{% else %}<span style="color:#d7263d;">N/A</span>{% endif %}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
