<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict Item Usage</title>
    <link rel="stylesheet" href="/static/items_ui.css">
    <style>
        body {
            background: #f4f8fb;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .predict-container {
            background: #fff;
            margin-top: 60px;
            padding: 32px 40px 24px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 350px;
            text-align: center;
        }
        h1 {
            color: #2a4d69;
            margin-bottom: 24px;
        }
        label {
            font-size: 1.1em;
            color: #2a4d69;
        }
        input[type="number"], select {
            padding: 8px;
            margin: 12px 0 20px 0;
            width: 80%;
            border: 1px solid #bfc9d1;
            border-radius: 6px;
            font-size: 1em;
        }
        button {
            background: #2a4d69;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #41729f;
        }
        .result {
            margin-top: 18px;
            font-size: 1.2em;
            color: #41729f;
        }
        .error {
            color: #d7263d;
            margin-top: 12px;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #2a4d69;
            text-decoration: none;
            font-size: 1em;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="predict-container">
        <h1>Predict Item Usage</h1>
        <form method="post">
            <label for="item_id">Select Item:</label><br>
            <select id="item_id" name="item_id" required>
                <option value="" disabled selected>Select an item</option>
                {% for item in items %}
                    <option value="{{ item.id }}" {% if selected_item == item.id %}selected{% endif %}>{{ item.name }}</option>
                {% endfor %}
            </select><br><br>
            <label for="day">Enter Day Number:</label><br>
            <input type="number" id="day" name="day" min="1" required><br>
            <button type="submit">Predict</button>
        </form>
        {% if prediction is not none %}
            <div class="result">Predicted Usage: <b>{{ prediction|round(2) }}</b></div>
        {% endif %}
        {% if error %}
            <div class="error">Error: {{ error }}</div>
        {% endif %}
        <a class="back-link" href="/items">&#8592; Back to Items</a>
    </div>
</body>
</html>
